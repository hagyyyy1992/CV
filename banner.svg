      from { width: 0; }
      to { width: 336px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes cursorAppear {
      0%, 99.9% { opacity: 0; }
      100% { opacity: 1; }
    }
    .cursor {
      opacity: 0;
      transform: translate(402.0px, 208px);
      animation: cursorAppear 20.32s forwards, blink 1s step-end 20.32s infinite;
    }
  </style>

