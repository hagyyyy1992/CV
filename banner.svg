<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    
    .reveal0 {
      animation: reveal0 2.56s steps(32) 0.00s forwards;
    }
    @keyframes reveal0 {
      from { width: 0; }
      to { width: 269px; }
    }
    .reveal1 {
      animation: reveal1 2.72s steps(34) 2.56s forwards;
    }
    @keyframes reveal1 {
      from { width: 0; }
      to { width: 286px; }
    }
    .reveal2 {
